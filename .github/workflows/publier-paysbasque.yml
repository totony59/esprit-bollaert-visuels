name: Publier sur Facebook – Cap sur le Pays basque

# Actif depuis le lancement de la page (02/11/2026).
on:
  push:
    branches: [main]
    paths: ["paysbasque/queue/**", "paysbasque/annuler/**"]
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:
    inputs:
      verifier:
        description: "Vérifier la clé Facebook sans rien publier"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publication-facebook-paysbasque
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # toujours l'état le plus récent : évite qu'un run en attente republie un post déjà publié (doublon du 08/11/2026)
      - name: Publier les posts arrivés à échéance
        env:
          FB_PAGE_ID: "1449261774934840"
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN_PAYSBASQUE }}
          DOSSIER_PAGE: paysbasque
          VERIFIER: ${{ inputs.verifier && '1' || '0' }}
        run: python3 publish.py
      - name: Enregistrer les posts publiés
        run: |
          git config user.name "robot-publication"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p paysbasque/queue
          git add -A paysbasque/queue paysbasque/published paysbasque/skipped paysbasque/scheduled paysbasque/annuler
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cap sur le Pays basque : posts publiés"
          for i in 1 2 3; do
            if git pull --rebase origin main; then git push && exit 0
            else
              # Conflit (ex. un fichier de paysbasque/queue/ modifié pendant la publication) : l'état du robot gagne TOUJOURS,
              # sinon le post déjà envoyé à Facebook resterait dans paysbasque/queue/ et serait republié (même correctif que Lens, 11/11/2026).
              git rebase --abort || true
              tmp=$(mktemp -d); cp -r paysbasque/published paysbasque/skipped paysbasque/scheduled "$tmp"/ 2>/dev/null || true
              git fetch -q origin main && git reset -q --hard origin/main
              for d in published skipped scheduled; do mkdir -p "paysbasque/$d"; [ -d "$tmp/$d" ] && cp -r "$tmp/$d/." "paysbasque/$d/"; done
              for f in paysbasque/published/*.json paysbasque/skipped/*.json paysbasque/scheduled/*.json; do [ -e "$f" ] && rm -f "paysbasque/queue/$(basename "$f")"; done
              git add -A paysbasque/queue paysbasque/published paysbasque/skipped paysbasque/scheduled paysbasque/annuler
              git diff --cached --quiet || git commit -m "Cap sur le Pays basque : posts publiés (fusion après conflit)"
              git push && exit 0
            fi
            sleep 5
          done
          exit 1

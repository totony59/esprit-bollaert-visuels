name: Export réel (lecture seule, chiffré)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lire les données (rien n'est publié)
        env:
          FB_PAGE_ID: "1385049348028097"
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN_BRETAGNE }}
        run: python3 outils/export_reel.py
      - name: Chiffrer l'export
        run: |
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in export.json -out export.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey outils/export_public.pem -in k.bin -out k.enc
          rm -f export.json k.bin
      - uses: actions/upload-artifact@v4
        with:
          name: export-chiffre
          path: |
            export.enc
            k.enc
          retention-days: 1

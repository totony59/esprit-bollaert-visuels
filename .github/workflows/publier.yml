name: Publier sur Facebook

on:
  push:
    branches: [main]
    paths: ["queue/**"]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      verifier:
        description: "Vérifier la clé Facebook sans rien publier"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publication-facebook
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publier les posts arrivés à échéance
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          VERIFIER: ${{ inputs.verifier && '1' || '0' }}
        run: python3 publish.py
      - name: Enregistrer les posts publiés
        run: |
          git config user.name "robot-publication"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue published skipped
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Posts publiés sur Facebook"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1

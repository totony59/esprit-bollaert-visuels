name: Publier sur Facebook

on:
  push:
    branches: [main]
    paths: ["queue/**", "annuler/**"]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      verifier:
        description: "Vérifier la clé Facebook sans rien publier"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publication-facebook
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # toujours la dernière version : évite de republier un post déjà publié par un run précédent
      - name: Publier les posts arrivés à échéance
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          VERIFIER: ${{ inputs.verifier && '1' || '0' }}
        run: python3 publish.py
      - name: Enregistrer les posts publiés
        run: |
          git config user.name "robot-publication"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue published skipped scheduled annuler
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Posts publiés sur Facebook"
          for i in 1 2 3; do
            if git pull --rebase origin main; then git push && exit 0
            else
              # Conflit (ex. un fichier de queue/ modifié pendant la publication) : l'état du robot gagne TOUJOURS,
              # sinon le post déjà envoyé à Facebook resterait dans queue/ et serait republié (doublon du 10/11/2026).
              git rebase --abort || true
              tmp=$(mktemp -d); cp -r published skipped scheduled "$tmp"/
              git fetch -q origin main && git reset -q --hard origin/main
              for d in published skipped scheduled; do mkdir -p "$d"; cp -r "$tmp/$d/." "$d/"; done
              for f in published/*.json skipped/*.json scheduled/*.json; do [ -e "$f" ] && rm -f "queue/$(basename "$f")"; done
              git add -A queue published skipped scheduled annuler
              git diff --cached --quiet || git commit -m "Posts publiés sur Facebook (fusion après conflit)"
              git push && exit 0
            fi
            sleep 5
          done
          exit 1

name: Publier sur Facebook – Cap sur la Bretagne

on:
  push:
    branches: [main]
    paths: ["bretagne/queue/**", "bretagne/annuler/**"]
  schedule:
    - cron: "5-59/10 * * * *"
  workflow_dispatch:
    inputs:
      verifier:
        description: "Vérifier la clé Facebook sans rien publier"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publication-facebook-bretagne
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # toujours l'état le plus récent : évite qu'un run en attente republie un post déjà publié (doublon du 08/11/2026)
      - name: Outils de retouche photo
        run: pip install --quiet pillow numpy || true
      - name: Publier les posts arrivés à échéance
        env:
          FB_PAGE_ID: "1385049348028097"
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN_BRETAGNE }}
          DOSSIER_PAGE: bretagne
          VERIFIER: ${{ inputs.verifier && '1' || '0' }}
        run: python3 publish.py
      - name: Enregistrer les posts publiés
        run: |
          git config user.name "robot-publication"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p bretagne/queue
          git add -A bretagne/queue bretagne/published bretagne/skipped bretagne/scheduled bretagne/annuler
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cap sur la Bretagne : posts publiés"
          for i in 1 2 3; do
            if git pull --rebase origin main; then git push && exit 0
            else
              # Conflit (ex. un fichier de bretagne/queue/ modifié pendant la publication) : l'état du robot gagne TOUJOURS,
              # sinon le post déjà envoyé à Facebook resterait dans bretagne/queue/ et serait republié (même correctif que Lens, 11/11/2026).
              git rebase --abort || true
              tmp=$(mktemp -d); cp -r bretagne/published bretagne/skipped bretagne/scheduled "$tmp"/ 2>/dev/null || true
              git fetch -q origin main && git reset -q --hard origin/main
              for d in published skipped scheduled; do mkdir -p "bretagne/$d"; [ -d "$tmp/$d" ] && cp -r "$tmp/$d/." "bretagne/$d/"; done
              for f in bretagne/published/*.json bretagne/skipped/*.json bretagne/scheduled/*.json; do [ -e "$f" ] && rm -f "bretagne/queue/$(basename "$f")"; done
              git add -A bretagne/queue bretagne/published bretagne/skipped bretagne/scheduled bretagne/annuler
              git diff --cached --quiet || git commit -m "Cap sur la Bretagne : posts publiés (fusion après conflit)"
              git push && exit 0
            fi
            sleep 5
          done
          exit 1
